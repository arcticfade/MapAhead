<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAP AHEAD</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>MAP AHEAD</h1>
                <button id="credits-btn" class="credits-button">Credits</button>
            </div>
        </header>
        
        <div class="controls">
            <input type="file" id="gpx-upload" accept=".gpx">
            <label for="gpx-upload" class="upload-button">Upload GPX</label>
            <span id="filename-display"></span>
        </div>
        
        <div class="main-content">
            <!-- Map Container -->
            <div id="map"></div>
            
            <!-- POI Table Container -->
            <div class="poi-table-container">
                <table id="poi-table">
                    <thead>
                        <tr>
                            <th>Distance on route</th>
                            <th>Deviation </th>
                            <th>Name of gas station</th>
                        </tr>
                    </thead>
                    <tbody id="poi-tbody">
                        <!-- POI rows will be added here dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="credits-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Credits</h2>
            <p>Map Ahead </p>
            <ul>
                <li>Map data: © OpenStreetMap contributors</li>
                <li>Mapping library: Leaflet</li>
            </ul>
        </div>
    </div>
    
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>
    
    <!-- Custom JavaScript -->
    <script src="static/script.js"></script>
</body>
</html>
